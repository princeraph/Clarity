# Portée : ce dépôt.
#
# Il a été écrit dans Personal-Work, sous projet-clarity/, où GitHub ne le lisait
# pas — les workflows ne sont lus qu'à la racine d'un dépôt. C'était voulu : le
# seul moyen de faire voyager la CI avec l'extraction. Depuis, ce dossier EST la
# racine, et le workflow tourne.
name: qualité

on:
  push:
    # Les branches de travail aussi : rien n'est fusionné dans main — d'où
    # l'utilisateur tire ses mises à jour — avant d'avoir passé ici, Windows
    # compris.
    branches: [main, 'claude/**']
  pull_request:

jobs:
  controles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # L'historique complet : le contrôle du paquet compare des fichiers
        # versionnés entre eux, et un clone superficiel rend tout verdict faux.
        with: { fetch-depth: 0 }

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: dépendances du backend
        working-directory: app/backend
        run: npm install --no-audit --no-fund

      - name: tests du backend
        working-directory: app/backend
        run: npm test

      # L'assistant intégré, de bout en bout, sur un modèle de 88 Mo : le
      # processus du moteur démarre, charge, écrit du texte et du JSON sous
      # schéma. La réponse n'a aucun sens ; la tuyauterie, elle, est vérifiée.
      # Pas plus petit : le modèle de 1 Mo essayé d'abord n'acceptait que 128
      # jetons de contexte, et la vraie requête de discussion le dépassait —
      # il a tourné jusqu'au délai de 5 minutes au lieu de répondre.
      - name: l'assistant intégré répond (petit modèle)
        working-directory: app/backend
        timeout-minutes: 5
        run: |
          mkdir -p "$RUNNER_TEMP/modeles"
          curl -sSfL -o "$RUNNER_TEMP/modeles/test.gguf" https://huggingface.co/bartowski/SmolLM2-135M-Instruct-GGUF/resolve/09816acd5d99df7be770d85ea30822623dab342c/SmolLM2-135M-Instruct-Q3_K_S.gguf
          echo "7add77b8d3736d6b2fd21dc96e69be026f19bde843e9988b43cef1315fc5eebe  $RUNNER_TEMP/modeles/test.gguf" | sha256sum -c -
          node tools/essai-moteur.mjs "$RUNNER_TEMP/modeles"

      - name: les deux langues sont complètes
        working-directory: app/frontend
        run: node tools/verifier-locales.mjs

      - name: la saisie rapide comprend les deux langues
        working-directory: app/frontend
        run: node tools/verifier-saisie.mjs

      - name: le paquet chargé par Electron est complet, et ne charge rien d'Internet
        working-directory: app
        run: node tools/verifier-paquet.mjs frontend/dist

      # frontend/dist/ est versionné exprès. S'il ne correspond plus aux
      # sources, l'app tourne sur l'ancien code alors que la revue lit le
      # nouveau — le défaut le plus facile à ne pas voir de tout ce dépôt.
      - name: dist/ correspond bien aux sources
        working-directory: app/frontend
        run: |
          npm install --no-audit --no-fund
          npm run build
          if ! git diff --quiet -- dist/; then
            echo "::error::dist/ ne correspond pas aux sources."
            echo "Lancer 'npm run build' dans app/frontend/ et committer dist/ dans le MÊME commit."
            git diff --stat -- dist/
            exit 1
          fi

  # Le moteur intégré sous Windows, sans empaqueter : quelques minutes au lieu
  # de vingt, pour localiser un défaut. Dans le processus ou dans son worker,
  # sous Node puis sous le Node d'Electron — ce qui distingue le moteur de ce
  # qui l'entoure.
  moteur-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: dépendances
        shell: cmd
        run: |
          cd app && call npm install --no-audit --no-fund || exit /b 1
          call npx install-electron || exit /b 1
          cd backend && call npm install --no-audit --no-fund || exit /b 1
      - name: modèle de test
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\modeles" | Out-Null
          Invoke-WebRequest -UseBasicParsing -OutFile "$env:RUNNER_TEMP\modeles\test.gguf" https://huggingface.co/bartowski/SmolLM2-135M-Instruct-GGUF/resolve/09816acd5d99df7be770d85ea30822623dab342c/SmolLM2-135M-Instruct-Q3_K_S.gguf
          if ((Get-FileHash -Algorithm SHA256 "$env:RUNNER_TEMP\modeles\test.gguf").Hash -ne '7ADD77B8D3736D6B2FD21DC96E69BE026F19BDE843E9988B43CEF1315FC5EEBE') { exit 1 }
      - name: Node, moteur dans le processus, défaut fils
        if: always()
        working-directory: app/backend
        timeout-minutes: 3
        env:
          CLARITY_LLAMA_THREADS: ''
        run: node tools/essai-moteur.mjs "$env:RUNNER_TEMP\modeles" --direct
      - name: Node, moteur dans le processus, 1 fils
        if: always()
        working-directory: app/backend
        timeout-minutes: 3
        env:
          CLARITY_LLAMA_THREADS: '1'
        run: node tools/essai-moteur.mjs "$env:RUNNER_TEMP\modeles" --direct
      - name: Node, moteur dans le processus, 2 fils
        if: always()
        working-directory: app/backend
        timeout-minutes: 3
        env:
          CLARITY_LLAMA_THREADS: '2'
        run: node tools/essai-moteur.mjs "$env:RUNNER_TEMP\modeles" --direct
      - name: Node, moteur dans le processus, 3 fils
        if: always()
        working-directory: app/backend
        timeout-minutes: 3
        env:
          CLARITY_LLAMA_THREADS: '3'
        run: node tools/essai-moteur.mjs "$env:RUNNER_TEMP\modeles" --direct

  # Windows, la plateforme de l'utilisateur. Les scripts qui le concernent
  # (Update.bat, setup.bat) ne pouvaient être essayés nulle part avant lui :
  # c'est lui qui découvrait chaque défaut, au moment de mettre à jour. Ce job
  # rejoue les étapes d'Update.bat sur une machine Windows neuve, puis installe
  # l'app en silence et vérifie qu'elle démarre.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: dépendances, comme Update.bat
        working-directory: app
        shell: cmd
        run: |
          call npm install --no-audit --no-fund || exit /b 1
          call npx install-electron || exit /b 1
          cd backend && call npm install --no-audit --no-fund || exit /b 1
          cd ..\frontend && call npm install --no-audit --no-fund || exit /b 1

      - name: empaqueter, comme Update.bat
        working-directory: app
        shell: cmd
        run: call npm run package

      # La mise à jour suivante est refusée dès qu'un fichier suivi a bougé.
      - name: aucun fichier suivi modifié par la mise à jour
        shell: pwsh
        run: |
          $sale = git status --porcelain --untracked-files=no
          if ($sale) { $sale; git diff; exit 1 }

      - name: installer en silence
        shell: pwsh
        run: |
          $setup = Get-ChildItem app/dist-electron -Filter 'Clarity Setup *.exe' | Select-Object -First 1
          Start-Process -Wait -FilePath $setup.FullName -ArgumentList '/S'
          $exe = Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Filter Clarity.exe | Select-Object -First 1
          if (-not $exe) { Write-Error "Clarity.exe introuvable après installation"; exit 1 }
          "installé : $($exe.FullName)"
          "CLARITY_EXE=$($exe.FullName)" >> $env:GITHUB_ENV

      # Le backend installé, lancé par le binaire installé — sans Node du système.
      - name: l'app installée sert les tâches et refuse un Host étranger
        shell: pwsh
        run: |
          $env:ELECTRON_RUN_AS_NODE = '1'
          $env:CLARITY_DATA_DIR = Join-Path $env:RUNNER_TEMP 'clarity-data'
          $backend = Join-Path (Split-Path $env:CLARITY_EXE) 'resources\backend\server.js'
          $p = Start-Process -PassThru -NoNewWindow -FilePath $env:CLARITY_EXE -ArgumentList "`"$backend`""
          $ok = $false
          for ($i = 0; $i -lt 40 -and -not $ok; $i++) {
            try { $r = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:3001/api/tasks; $ok = $r.StatusCode -eq 200 } catch { Start-Sleep -Milliseconds 500 }
          }
          if (-not $ok) { Write-Error "le backend installé ne répond pas"; exit 1 }
          "Host légitime : 200"
          try { Invoke-WebRequest -UseBasicParsing -Headers @{ Host = 'evil.example:3001' } http://127.0.0.1:3001/api/tasks | Out-Null; Write-Error "Host étranger accepté"; exit 1 }
          catch { if ($_.Exception.Response.StatusCode.value__ -ne 403) { throw } ; "Host étranger : 403" }
          Stop-Process -Id $p.Id -Force

      # L'assistant intégré dans l'app installée : le moteur qui a survécu à
      # l'empaquetage (CPU + Vulkan, sans CUDA), lancé par Clarity.exe, répond
      # par les routes que l'interface appelle — discussion en flux, et pistes
      # « je suis bloqué » en JSON sous schéma.
      - name: l'app installée répond avec l'assistant intégré
        shell: pwsh
        timeout-minutes: 8
        run: |
          $modeles = Join-Path $env:RUNNER_TEMP 'modeles'
          New-Item -ItemType Directory -Force -Path $modeles | Out-Null
          $gguf = Join-Path $modeles 'test.gguf'
          Invoke-WebRequest -UseBasicParsing -OutFile $gguf https://huggingface.co/bartowski/SmolLM2-135M-Instruct-GGUF/resolve/09816acd5d99df7be770d85ea30822623dab342c/SmolLM2-135M-Instruct-Q3_K_S.gguf
          if ((Get-FileHash -Algorithm SHA256 $gguf).Hash -ne '7ADD77B8D3736D6B2FD21DC96E69BE026F19BDE843E9988B43CEF1315FC5EEBE') { Write-Error "modèle de test altéré"; exit 1 }

          $env:ELECTRON_RUN_AS_NODE = '1'
          $env:CLARITY_DATA_DIR = Join-Path $env:RUNNER_TEMP 'clarity-moteur'
          $env:CLARITY_MODELS_DIR = $modeles
          New-Item -ItemType Directory -Force -Path $env:CLARITY_DATA_DIR | Out-Null
          @{ providerType = 'local'; onboardingComplete = $true } | ConvertTo-Json | Set-Content -Encoding utf8 (Join-Path $env:CLARITY_DATA_DIR 'settings.json')
          $backend = Join-Path (Split-Path $env:CLARITY_EXE) 'resources\backend\server.js'
          $p = Start-Process -PassThru -NoNewWindow -FilePath $env:CLARITY_EXE -ArgumentList "`"$backend`""
          $ok = $false
          for ($i = 0; $i -lt 40 -and -not $ok; $i++) {
            try { $ok = (Invoke-WebRequest -UseBasicParsing http://127.0.0.1:3001/api/health).StatusCode -eq 200 } catch { Start-Sleep -Milliseconds 500 }
          }
          if (-not $ok) { Write-Error "le backend installé ne répond pas"; exit 1 }

          $chat = Invoke-WebRequest -UseBasicParsing -TimeoutSec 120 -Method Post -Uri http://127.0.0.1:3001/api/chat -ContentType 'application/json' -Body '{"message":"Once upon a time","history":[]}'
          if ($chat.Content -notmatch '"token"') { Write-Error "la discussion n'a rien renvoyé : $($chat.Content)"; exit 1 }
          "discussion : $(([regex]::Matches($chat.Content, '"token"')).Count) morceaux reçus"

          $tache = Invoke-RestMethod -Method Post -Uri http://127.0.0.1:3001/api/tasks -ContentType 'application/json' -Body '{"title":"Essai"}'
          $pistes = Invoke-RestMethod -TimeoutSec 120 -Method Post -Uri "http://127.0.0.1:3001/api/tasks/$($tache.task.id)/thread/suggest"
          "pistes : réponse JSON lue, $($pistes.added) ajoutée(s)"
          Stop-Process -Id $p.Id -Force
          Get-Process Clarity -ErrorAction SilentlyContinue | Stop-Process -Force

      # Le chiffrement des secrets ne peut être prouvé que sous Windows : il passe
      # par DPAPI, via le processus principal d'Electron. L'app installée, la
      # vraie, lancée telle quelle : migration d'une ancienne clé en clair, puis
      # une clé neuve enregistrée, puis un redémarrage qui doit la retrouver.
      - name: la clé d'API est chiffrée, et survit au redémarrage
        shell: pwsh
        run: |
          $data = Join-Path $env:APPDATA 'Clarity\data'
          $fichier = Join-Path $data 'settings.json'
          $masque = ([string][char]0x2022) * 8
          function Attendre { for ($i = 0; $i -lt 90; $i++) { try { if ((Invoke-WebRequest -UseBasicParsing http://127.0.0.1:3001/api/health).StatusCode -eq 200) { return } } catch {}; Start-Sleep -Milliseconds 500 }; throw "Clarity ne répond pas" }
          function Arreter { Get-Process Clarity -ErrorAction SilentlyContinue | Stop-Process -Force; Start-Sleep -Seconds 3 }
          Arreter

          # 0. Comme chez l'utilisateur : Clarity a déjà tourné. safeStorage ne
          #    chiffre pas avec DPAPI directement — il chiffre avec une clé que
          #    Chromium génère au premier lancement, protège par DPAPI, et écrit
          #    dans « Local State » une dizaine de secondes plus tard. Mesuré :
          #    tué avant cette écriture, l'app perdait la clé, et tout secret
          #    chiffré avec. On reproduit donc la vraie situation — un premier
          #    lancement complet — puis on vérifie que la clé est bien sur disque.
          Start-Process -FilePath $env:CLARITY_EXE; Attendre; Start-Sleep -Seconds 15; Arreter
          $ls = Get-Content (Join-Path $env:APPDATA 'Clarity\Local State') -Raw
          if ($ls -notmatch '"encrypted_key"') { Write-Error "Local State ne porte pas la clé de chiffrement après un premier lancement"; exit 1 }
          "premier lancement : la clé de chiffrement est écrite dans Local State"

          # 1. Une ancienne version avait écrit la clé en clair.
          New-Item -ItemType Directory -Force -Path $data | Out-Null
          $ancienne = "sk-ANCIENNE-$([guid]::NewGuid())"
          @{ providerType = 'openai'; apiKey = $ancienne } | ConvertTo-Json | Set-Content -Encoding utf8 $fichier
          Start-Process -FilePath $env:CLARITY_EXE; Attendre
          $c = Get-Content $fichier -Raw
          if ($c -match [regex]::Escape($ancienne)) { Write-Error "migration : l'ancienne clé est toujours en clair"; exit 1 }
          if ($c -notmatch '"enc"') { Write-Error "migration : rien de chiffré"; exit 1 }
          "migration : l'ancienne clé est désormais chiffrée"

          # 2. Une clé neuve, enregistrée par l'app.
          $temoin = "sk-TEMOIN-$([guid]::NewGuid())"
          Invoke-RestMethod -Method Post -Uri http://127.0.0.1:3001/api/settings -ContentType 'application/json' -Body (@{ providerType = 'openai'; apiKey = $temoin } | ConvertTo-Json) | Out-Null
          $c = Get-Content $fichier -Raw
          if ($c -match [regex]::Escape($temoin)) { Write-Error "la clé neuve est écrite en clair"; exit 1 }
          if ($c -notmatch '"enc"') { Write-Error "la clé neuve n'est pas chiffrée"; exit 1 }
          "enregistrement : aucune trace de la clé en clair dans settings.json"

          # 3. Redémarrage IMMÉDIAT après l'enregistrement — le cas dur : aucun
          #    délai ne doit plus être nécessaire, la clé de chiffrement existait.
          Arreter; Start-Process -FilePath $env:CLARITY_EXE; Attendre
          $relu = (Invoke-RestMethod http://127.0.0.1:3001/api/settings).apiKey
          if ($relu -ne $masque) { Write-Error "après redémarrage, la clé est perdue (lu : '$relu')"; exit 1 }
          "redémarrage : la clé est relue et déchiffrée"
          Arreter

      # L'option « installer Ollama pour moi », pour de vrai : l'app installée
      # télécharge l'installateur officiel, vérifie sa signature Authenticode,
      # l'installe sans droits d'admin, le démarre, tire un petit modèle, puis
      # bascule dessus. La discussion doit ensuite répondre PAR Ollama.
      - name: l'app installée installe Ollama et s'y branche
        shell: pwsh
        timeout-minutes: 20
        run: |
          Get-Process Clarity -ErrorAction SilentlyContinue | Stop-Process -Force
          $env:ELECTRON_RUN_AS_NODE = '1'
          $env:CLARITY_DATA_DIR = Join-Path $env:RUNNER_TEMP 'clarity-ollama'
          New-Item -ItemType Directory -Force -Path $env:CLARITY_DATA_DIR | Out-Null
          @{ providerType = 'ollama'; onboardingComplete = $true } | ConvertTo-Json | Set-Content -Encoding utf8 (Join-Path $env:CLARITY_DATA_DIR 'settings.json')
          $backend = Join-Path (Split-Path $env:CLARITY_EXE) 'resources\backend\server.js'
          $log = Join-Path $env:RUNNER_TEMP 'backend-ollama.log'
          $p = Start-Process -PassThru -NoNewWindow -FilePath $env:CLARITY_EXE -ArgumentList "`"$backend`"" -RedirectStandardOutput $log
          $ok = $false
          for ($i = 0; $i -lt 40 -and -not $ok; $i++) {
            try { $ok = (Invoke-WebRequest -UseBasicParsing http://127.0.0.1:3001/api/health).StatusCode -eq 200 } catch { Start-Sleep -Milliseconds 500 }
          }
          if (-not $ok) { Write-Error "le backend installé ne répond pas"; exit 1 }

          $avant = Invoke-RestMethod http://127.0.0.1:3001/api/ollama/install
          "avant : prise en charge=$($avant.supported) installé=$($avant.installed) en marche=$($avant.running)"
          Invoke-RestMethod -Method Post -Uri http://127.0.0.1:3001/api/ollama/install -ContentType 'application/json' -Body '{"model":"smollm2:135m"}' | Out-Null
          $etat = ''
          for ($i = 0; $i -lt 900; $i++) {
            $s = (Invoke-RestMethod http://127.0.0.1:3001/api/ollama/install).install
            if ($s.state -ne $etat) { "$([int]($i))s : $($s.state) $($s.received)/$($s.total) $($s.error)"; $etat = $s.state }
            if ($s.state -in 'done', 'error', 'cancelled') { break }
            Start-Sleep -Seconds 1
          }
          Get-Content $log | Select-String 'ollama'
          if ($etat -ne 'done') { Write-Error "installation d'Ollama : $etat"; exit 1 }

          $reglages = Invoke-RestMethod http://127.0.0.1:3001/api/settings
          if ($reglages.providerType -ne 'ollama' -or $reglages.ollamaModel -ne 'smollm2:135m') { Write-Error "Clarity n'a pas basculé sur Ollama"; exit 1 }
          $sante = Invoke-RestMethod http://127.0.0.1:3001/api/health
          if (-not $sante.ollama) { Write-Error "Ollama installé mais injoignable"; exit 1 }
          "modèles d'Ollama : $($sante.availableModels -join ', ')"
          $chat = Invoke-WebRequest -UseBasicParsing -TimeoutSec 180 -Method Post -Uri http://127.0.0.1:3001/api/chat -ContentType 'application/json' -Body '{"message":"Hello","history":[]}'
          if ($chat.Content -notmatch '"token"') { Write-Error "Ollama n'a pas répondu : $($chat.Content)"; exit 1 }
          "discussion par Ollama : $(([regex]::Matches($chat.Content, '"token"')).Count) morceaux reçus"
          Stop-Process -Id $p.Id -Force

      # Qui modifie frontend/src/ sous Windows reconstruit dist/ et le commite.
      # Ce build doit rendre les octets déjà versionnés : il en rendait un de
      # trop (un CRLF sur `<div id="root"></div>`), ce qui bloquait le pull.
      - name: dist/ reconstruit sous Windows est identique au versionné
        working-directory: app/frontend
        shell: pwsh
        run: |
          npm run build
          $sale = git status --porcelain -- dist/
          if ($sale) { $sale; git diff -- dist/; exit 1 }
