# Portée : ce dépôt.
#
# Il a été écrit dans Personal-Work, sous projet-clarity/, où GitHub ne le lisait
# pas — les workflows ne sont lus qu'à la racine d'un dépôt. C'était voulu : le
# seul moyen de faire voyager la CI avec l'extraction. Depuis, ce dossier EST la
# racine, et le workflow tourne.
name: qualité

on:
  push:
    # Les branches de travail aussi : rien n'est fusionné dans main — d'où
    # l'utilisateur tire ses mises à jour — avant d'avoir passé ici, Windows
    # compris.
    branches: [main, 'claude/**']
  pull_request:

jobs:
  controles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # L'historique complet : le contrôle du paquet compare des fichiers
        # versionnés entre eux, et un clone superficiel rend tout verdict faux.
        with: { fetch-depth: 0 }

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: dépendances du backend
        working-directory: app/backend
        run: npm install --no-audit --no-fund

      - name: tests du backend
        working-directory: app/backend
        run: npm test

      - name: les deux langues sont complètes
        working-directory: app/frontend
        run: node tools/verifier-locales.mjs

      - name: la saisie rapide comprend les deux langues
        working-directory: app/frontend
        run: node tools/verifier-saisie.mjs

      - name: le paquet chargé par Electron est complet, et ne charge rien d'Internet
        working-directory: app
        run: node tools/verifier-paquet.mjs frontend/dist

      # frontend/dist/ est versionné exprès. S'il ne correspond plus aux
      # sources, l'app tourne sur l'ancien code alors que la revue lit le
      # nouveau — le défaut le plus facile à ne pas voir de tout ce dépôt.
      - name: dist/ correspond bien aux sources
        working-directory: app/frontend
        run: |
          npm install --no-audit --no-fund
          npm run build
          if ! git diff --quiet -- dist/; then
            echo "::error::dist/ ne correspond pas aux sources."
            echo "Lancer 'npm run build' dans app/frontend/ et committer dist/ dans le MÊME commit."
            git diff --stat -- dist/
            exit 1
          fi

  # Windows, la plateforme de l'utilisateur. Les scripts qui le concernent
  # (Update.bat, setup.bat) ne pouvaient être essayés nulle part avant lui :
  # c'est lui qui découvrait chaque défaut, au moment de mettre à jour. Ce job
  # rejoue les étapes d'Update.bat sur une machine Windows neuve, puis installe
  # l'app en silence et vérifie qu'elle démarre.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: dépendances, comme Update.bat
        working-directory: app
        shell: cmd
        run: |
          call npm install --no-audit --no-fund || exit /b 1
          call npx install-electron || exit /b 1
          cd backend && call npm install --no-audit --no-fund || exit /b 1
          cd ..\frontend && call npm install --no-audit --no-fund || exit /b 1

      - name: empaqueter, comme Update.bat
        working-directory: app
        shell: cmd
        run: call npm run package

      # La mise à jour suivante est refusée dès qu'un fichier suivi a bougé.
      - name: aucun fichier suivi modifié par la mise à jour
        shell: pwsh
        run: |
          $sale = git status --porcelain --untracked-files=no
          if ($sale) { $sale; git diff; exit 1 }

      - name: installer en silence
        shell: pwsh
        run: |
          $setup = Get-ChildItem app/dist-electron -Filter 'Clarity Setup *.exe' | Select-Object -First 1
          Start-Process -Wait -FilePath $setup.FullName -ArgumentList '/S'
          $exe = Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Filter Clarity.exe | Select-Object -First 1
          if (-not $exe) { Write-Error "Clarity.exe introuvable après installation"; exit 1 }
          "installé : $($exe.FullName)"
          "CLARITY_EXE=$($exe.FullName)" >> $env:GITHUB_ENV

      # Le backend installé, lancé par le binaire installé — sans Node du système.
      - name: l'app installée sert les tâches et refuse un Host étranger
        shell: pwsh
        run: |
          $env:ELECTRON_RUN_AS_NODE = '1'
          $env:CLARITY_DATA_DIR = Join-Path $env:RUNNER_TEMP 'clarity-data'
          $backend = Join-Path (Split-Path $env:CLARITY_EXE) 'resources\backend\server.js'
          $p = Start-Process -PassThru -NoNewWindow -FilePath $env:CLARITY_EXE -ArgumentList "`"$backend`""
          $ok = $false
          for ($i = 0; $i -lt 40 -and -not $ok; $i++) {
            try { $r = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:3001/api/tasks; $ok = $r.StatusCode -eq 200 } catch { Start-Sleep -Milliseconds 500 }
          }
          if (-not $ok) { Write-Error "le backend installé ne répond pas"; exit 1 }
          "Host légitime : 200"
          try { Invoke-WebRequest -UseBasicParsing -Headers @{ Host = 'evil.example:3001' } http://127.0.0.1:3001/api/tasks | Out-Null; Write-Error "Host étranger accepté"; exit 1 }
          catch { if ($_.Exception.Response.StatusCode.value__ -ne 403) { throw } ; "Host étranger : 403" }
          Stop-Process -Id $p.Id -Force

      # Diagnostic, pas encore un contrôle : ce que la reconstruction de dist/
      # change sous Windows (une ligne de index.html chez l'utilisateur).
      - name: diagnostic — dist/ reconstruit sous Windows
        working-directory: app/frontend
        shell: pwsh
        run: |
          npm run build
          git diff -- dist/
          git checkout -- dist/
