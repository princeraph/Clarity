# Portée : ce dépôt. Publie une version de Clarity pour les testeurs.
#
# Déclenché quand la version de app/package.json change sur main — donc sur
# un commit que la CI (qualite) a déjà validé, Windows compris, puisque rien
# n'est fusionné dans main avant. Ce workflow ne refait pas ces contrôles : il
# fabrique l'installateur et le publie, une seule fois par version (il regarde
# d'abord si clarity-releases l'a déjà).
#
# Pas de tag à pousser : la session de travail ne peut pas pousser de tags
# (refusé, 6 octobre), et un tag oublié laisserait une version non publiée
# sans que rien ne le dise.
#
# Où : le dépôt PUBLIC princeraph/clarity-releases, qui ne contient que des
# installateurs et la page de téléchargement. Le code reste ici, privé. Les
# applis installées y lisent leurs mises à jour sans jeton (latest.yml).
#
# Prérequis, une fois : le secret CLARITY_RELEASES_TOKEN (jeton GitHub
# « fine-grained » limité à clarity-releases, droit Contents en écriture).
name: publication

on:
  push:
    branches: [main]
    paths: ['app/package.json', '.github/workflows/publication.yml']
  workflow_dispatch:

# Jamais annulée en cours : une publication coupée laisserait une release à
# moitié déposée. Deux déclenchements se suivent au lieu de s'interrompre.
# Coût estimé : ~15 min Windows × 2 = ~30 min par version publiée.
concurrency:
  group: publication
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Publiée = la release existe ET porte les trois fichiers dont la mise à
      # jour a besoin. Le premier essai (6 octobre) a laissé une release v1.3.0
      # sans latest.yml : « elle existe » ne suffisait pas, et la vérification
      # précédente concluait à tort qu'il n'y avait rien à faire.
      - name: cette version est-elle déjà publiée ?
        id: version
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.CLARITY_RELEASES_TOKEN }}
        run: |
          $version = (Get-Content app/package.json -Raw | ConvertFrom-Json).version
          "version=$version" >> $env:GITHUB_OUTPUT
          $assets = gh release view "v$version" --repo princeraph/clarity-releases --json assets --jq '.assets[].name' 2>$null
          if ($LASTEXITCODE -ne 0) { "existe=non" >> $env:GITHUB_OUTPUT; $assets = @() } else { "existe=oui" >> $env:GITHUB_OUTPUT }
          $manque = @('Clarity-Setup.exe', 'Clarity-Setup.exe.blockmap', 'latest.yml') | Where-Object { $assets -notcontains $_ }
          if ($manque) {
            "v$version à publier — manque : $($manque -join ', ')"
            "publier=oui" >> $env:GITHUB_OUTPUT
          } else {
            "v$version est complète sur clarity-releases : rien à faire."
            "publier=non" >> $env:GITHUB_OUTPUT
          }
          # Sinon l'étape hérite du code 1 de « gh release view » quand la
          # release n'existe pas encore — le cas normal d'une nouvelle version
          # (échec du 6 octobre sur la v1.3.1 ; la v1.3.0 existait déjà).
          exit 0

      - name: le jeton de publication est configuré
        if: steps.version.outputs.publier == 'oui'
        shell: pwsh
        env:
          TOKEN: ${{ secrets.CLARITY_RELEASES_TOKEN }}
        run: |
          if (-not $env:TOKEN) {
            Write-Error "Secret CLARITY_RELEASES_TOKEN absent : Settings → Secrets and variables → Actions du dépôt clarity."
            exit 1
          }

      - name: dépendances
        if: steps.version.outputs.publier == 'oui'
        working-directory: app
        shell: cmd
        run: |
          call npm install --no-audit --no-fund || exit /b 1
          call npx install-electron || exit /b 1
          cd backend && call npm install --no-audit --no-fund || exit /b 1

      # frontend/dist est versionné et déjà vérifié par la CI : pas de rebuild.
      # Fabriqué sans publier : electron-builder créait la release lui-même et
      # GitHub la refusait (« Published releases must have a valid tag »,
      # 6 octobre). La release est créée plus bas, avec un tag explicite.
      - name: fabriquer l'installateur
        if: steps.version.outputs.publier == 'oui'
        working-directory: app
        shell: cmd
        run: call npm run package

      - name: les fichiers de la mise à jour sont là
        if: steps.version.outputs.publier == 'oui'
        shell: pwsh
        run: |
          foreach ($f in 'Clarity-Setup.exe', 'Clarity-Setup.exe.blockmap', 'latest.yml') {
            if (-not (Test-Path "app/dist-electron/$f")) { Write-Error "manque app/dist-electron/$f"; exit 1 }
          }
          Get-Content app/dist-electron/latest.yml

      # La page d'abord : elle donne au dépôt (vide au départ) le commit sur
      # lequel poser le tag de la release.
      - name: mettre à jour la page de téléchargement
        if: steps.version.outputs.publier == 'oui'
        shell: pwsh
        env:
          TOKEN: ${{ secrets.CLARITY_RELEASES_TOKEN }}
        run: |
          git clone "https://x-access-token:$env:TOKEN@github.com/princeraph/clarity-releases.git" rel
          Copy-Item -Recurse -Force app/release-site/* rel/
          Set-Location rel
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          git checkout -B main
          git add -A
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { "page inchangée" } else { git commit -m "Page de téléchargement : v${{ steps.version.outputs.version }}" }
          git push -u origin main

      - name: publier la version
        if: steps.version.outputs.publier == 'oui'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.CLARITY_RELEASES_TOKEN }}
        run: |
          $v = "v${{ steps.version.outputs.version }}"
          $files = 'app/dist-electron/Clarity-Setup.exe', 'app/dist-electron/Clarity-Setup.exe.blockmap', 'app/dist-electron/latest.yml'
          if ('${{ steps.version.outputs.existe }}' -eq 'oui') {
            # Une release incomplète est complétée, pas recréée : --clobber
            # remplace un fichier du même nom.
            gh release upload $v --repo princeraph/clarity-releases --clobber @files
          } else {
            gh release create $v --repo princeraph/clarity-releases --target main --title "Clarity ${{ steps.version.outputs.version }}" --notes "Téléchargez Clarity-Setup.exe ci-dessous, ou passez par la page : https://princeraph.github.io/clarity-releases/" @files
          }
          if ($LASTEXITCODE -ne 0) { exit 1 }
          # Publiée et marquée « latest » : c'est ce que lisent le lien de la
          # page (releases/latest/download/…) et la mise à jour automatique.
          gh release edit $v --repo princeraph/clarity-releases --draft=false --latest
          gh release view $v --repo princeraph/clarity-releases
